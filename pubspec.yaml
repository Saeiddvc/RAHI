name: rahi
description: "RAHI - Smart Navigation | راهی، مسیریاب هوشمند"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: 5.8.0+1
  flutter_map: 8.2.2
  flutter_riverpod: 2.6.1
  flutter_tts: 4.2.5
  geolocator: 14.1.1
  go_router: 14.8.1
  intl: any
  latlong2: 0.9.1
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
