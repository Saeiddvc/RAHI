name: rahi
description: RAHI smart navigation application
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: 5.8.0+1
  flutter_map: 8.2.2
  flutter_riverpod: 2.6.1
  geolocator: 14.1.1
  intl: any
  latlong2: 0.9.1
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true
