name: RAHI Android CI

on:
  push:
    branches:
      - bootstrap-v0.1.0
      - 'v1-commit-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare non-secret constants
        run: cp secrets.example.dart lib/core/constants/secrets.dart

      - name: Generate Android scaffold
        shell: bash
        run: |
          mkdir -p /tmp/rahi-source
          cp -R lib /tmp/rahi-source/lib
          cp -R test /tmp/rahi-source/test
          cp pubspec.yaml /tmp/rahi-source/pubspec.yaml
          cp analysis_options.yaml /tmp/rahi-source/analysis_options.yaml
          if [ -f l10n.yaml ]; then cp l10n.yaml /tmp/rahi-source/l10n.yaml; fi

          flutter create .             --platforms=android             --project-name=rahi             --org=ir.rahi

          rm -rf lib test
          cp -R /tmp/rahi-source/lib ./lib
          cp -R /tmp/rahi-source/test ./test
          cp /tmp/rahi-source/pubspec.yaml ./pubspec.yaml
          cp /tmp/rahi-source/analysis_options.yaml ./analysis_options.yaml
          if [ -f /tmp/rahi-source/l10n.yaml ]; then
            cp /tmp/rahi-source/l10n.yaml ./l10n.yaml
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated localizations
        shell: bash
        run: |
          test -f lib/l10n/app_localizations.dart
          test -f lib/l10n/app_localizations_fa.dart
          test -f lib/l10n/app_localizations_ar.dart
          test -f lib/l10n/app_localizations_en.dart

      - name: Format source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAHI-v0.1.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
