name: RAHI Android CI

on:
  push:
    branches:
      - bootstrap-v0.1.0
      - 'v1-commit-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        shell: bash
        run: |
          mkdir -p /tmp/rahi-source
          cp -R lib /tmp/rahi-source/lib
          cp -R test /tmp/rahi-source/test
          cp pubspec.yaml /tmp/rahi-source/pubspec.yaml
          cp analysis_options.yaml /tmp/rahi-source/analysis_options.yaml
          if [ -f l10n.yaml ]; then cp l10n.yaml /tmp/rahi-source/l10n.yaml; fi

          mkdir -p /tmp/rahi-android
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/rahi-android/AndroidManifest.xml
          fi
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            cp android/app/src/main/res/values/strings.xml /tmp/rahi-android/strings.xml
          fi
          if [ -f android/app/build.gradle.kts ]; then
            cp android/app/build.gradle.kts /tmp/rahi-android/build.gradle.kts
          fi
          if [ -f android/app/proguard-rules.pro ]; then
            cp android/app/proguard-rules.pro /tmp/rahi-android/proguard-rules.pro
          fi
          if [ -f android/gradle.properties ]; then
            cp android/gradle.properties /tmp/rahi-android/gradle.properties
          fi

          flutter create .             --platforms=android             --project-name=rahi             --org=ir.rahi

          rm -rf lib test
          cp -R /tmp/rahi-source/lib ./lib
          cp -R /tmp/rahi-source/test ./test
          cp /tmp/rahi-source/pubspec.yaml ./pubspec.yaml
          cp /tmp/rahi-source/analysis_options.yaml ./analysis_options.yaml
          if [ -f /tmp/rahi-source/l10n.yaml ]; then
            cp /tmp/rahi-source/l10n.yaml ./l10n.yaml
          fi

          if [ -f /tmp/rahi-android/AndroidManifest.xml ]; then
            cp /tmp/rahi-android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/rahi-android/strings.xml ]; then
            mkdir -p android/app/src/main/res/values
            cp /tmp/rahi-android/strings.xml android/app/src/main/res/values/strings.xml
          fi
          if [ -f /tmp/rahi-android/build.gradle.kts ]; then
            cp /tmp/rahi-android/build.gradle.kts android/app/build.gradle.kts
          fi
          if [ -f /tmp/rahi-android/proguard-rules.pro ]; then
            cp /tmp/rahi-android/proguard-rules.pro android/app/proguard-rules.pro
          fi
          if [ -f /tmp/rahi-android/gradle.properties ]; then
            cp /tmp/rahi-android/gradle.properties android/gradle.properties
          fi

      - name: Verify tracked compile-time secrets contract
        shell: bash
        run: |
          test -f lib/core/constants/secrets.dart
          grep -F "String.fromEnvironment(" lib/core/constants/secrets.dart
          test ! -f secrets.example.dart

      - name: Verify Android source manifest
        shell: bash
        run: |
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -F 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:supportsRtl="true"' android/app/src/main/AndroidManifest.xml
          grep -F '<string name="app_name">راهی</string>' android/app/src/main/res/values/strings.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated localizations
        shell: bash
        run: |
          test -f lib/l10n/app_localizations.dart
          test -f lib/l10n/app_localizations_fa.dart
          test -f lib/l10n/app_localizations_ar.dart
          test -f lib/l10n/app_localizations_en.dart

      - name: Format source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify merged debug manifest
        shell: bash
        run: |
          MERGED_MANIFEST="$(find build/app/intermediates -type f -path '*debug*' -name AndroidManifest.xml | head -n 1)"
          if [ -z "$MERGED_MANIFEST" ]; then
            echo "Merged debug AndroidManifest.xml not found"
            exit 1
          fi
          echo "Verifying: $MERGED_MANIFEST"
          grep -F 'android.permission.INTERNET' "$MERGED_MANIFEST"
          grep -F 'android.permission.ACCESS_NETWORK_STATE' "$MERGED_MANIFEST"
          grep -F 'android.permission.ACCESS_FINE_LOCATION' "$MERGED_MANIFEST"
          grep -F 'android.permission.ACCESS_COARSE_LOCATION' "$MERGED_MANIFEST"
          grep -F 'android.intent.action.TTS_SERVICE' "$MERGED_MANIFEST"
          grep -F 'android:usesCleartextTraffic="false"' "$MERGED_MANIFEST"
          grep -F 'android:supportsRtl="true"' "$MERGED_MANIFEST"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: RAHI-v0.1.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
